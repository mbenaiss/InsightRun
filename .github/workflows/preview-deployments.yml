name: Preview Deployments

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the codebase changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            admin:
              - 'admin/**'

  # Deploy frontend preview to Cloudflare Workers
  preview_frontend:
    name: Deploy Frontend Preview
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      url: ${{ steps.extract-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: bun run pages:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_ENV: preview

      - name: Generate preview alias
        id: generate-alias
        run: |
          # Generate valid preview alias from branch name
          # Rules: lowercase, alphanumeric + dashes, must start with letter, max 63 chars with worker name
          BRANCH_NAME="${{ github.head_ref }}"
          # Convert to lowercase, replace non-alphanumeric with dash, remove leading/trailing dashes
          ALIAS=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//' | cut -c1-30)
          # Ensure it starts with a letter
          if ! [[ $ALIAS =~ ^[a-z] ]]; then
            ALIAS="pr-$ALIAS"
          fi
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "Generated alias: $ALIAS"

      - name: Deploy to Cloudflare Workers (Preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.generate-alias.outputs.alias }}
          workingDirectory: frontend
        env:
          NODE_ENV: preview

      - name: Extract deployment URL and status
        id: extract-url
        run: |
          # Preview URL format: <ALIAS>-<WORKER_NAME>.mbenaissa.workers.dev
          ALIAS="${{ steps.generate-alias.outputs.alias }}"
          PREVIEW_URL="https://${ALIAS}-insightrun-landing.mbenaissa.workers.dev"

          # Set outputs
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "status=READY" >> $GITHUB_OUTPUT
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT

          echo "✅ Preview URL: $PREVIEW_URL"
          echo "📝 Alias: $ALIAS"

  # Deploy backend preview to Cloudflare Workers
  preview_backend:
    name: Deploy Backend Preview
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      url: ${{ steps.extract-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Generate preview alias
        id: generate-alias
        run: |
          # Generate valid preview alias from branch name
          # Rules: lowercase, alphanumeric + dashes, must start with letter, max 63 chars with worker name
          BRANCH_NAME="${{ github.head_ref }}"
          # Convert to lowercase, replace non-alphanumeric with dash, remove leading/trailing dashes
          ALIAS=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//' | cut -c1-30)
          # Ensure it starts with a letter
          if ! [[ $ALIAS =~ ^[a-z] ]]; then
            ALIAS="pr-$ALIAS"
          fi
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "Generated alias: $ALIAS"

      - name: Deploy to Cloudflare Workers (Preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.generate-alias.outputs.alias }}
          workingDirectory: backend
        env:
          NODE_ENV: preview

      - name: Extract deployment URL and status
        id: extract-url
        run: |
          # Preview URL format: <ALIAS>-<WORKER_NAME>.mbenaissa.workers.dev
          ALIAS="${{ steps.generate-alias.outputs.alias }}"
          PREVIEW_URL="https://${ALIAS}-insightrun-backend.mbenaissa.workers.dev"

          # Set outputs
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "status=READY" >> $GITHUB_OUTPUT
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT

          echo "✅ Preview URL: $PREVIEW_URL"
          echo "📝 Alias: $ALIAS"

  # Deploy admin preview to Cloudflare Workers
  preview_admin:
    name: Deploy Admin Preview
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    outputs:
      url: ${{ steps.extract-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Generate preview alias
        id: generate-alias
        run: |
          # Generate valid preview alias from branch name
          BRANCH_NAME="${{ github.head_ref }}"
          ALIAS=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//' | cut -c1-30)
          if ! [[ $ALIAS =~ ^[a-z] ]]; then
            ALIAS="pr-$ALIAS"
          fi
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "Generated alias: $ALIAS"

      - name: Build for Cloudflare Workers
        run: bun run pages:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_API_URL: https://api.insightrun.altcode.studio
          NEXT_PUBLIC_ENV: preview

      - name: Deploy to Cloudflare Workers (Preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.generate-alias.outputs.alias }}
          workingDirectory: admin
        env:
          NODE_ENV: preview

      - name: Extract deployment URL and status
        id: extract-url
        run: |
          ALIAS="${{ steps.generate-alias.outputs.alias }}"
          PREVIEW_URL="https://${ALIAS}-insightrun-admin.mbenaissa.workers.dev"

          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "status=READY" >> $GITHUB_OUTPUT
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT

          echo "✅ Preview URL: $PREVIEW_URL"
          echo "📝 Alias: $ALIAS"

  # Comment on PR with preview URLs
  comment:
    name: Comment Preview URLs
    needs: [changes, preview_frontend, preview_backend, preview_admin]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- preview-deployments -->'

      - name: Build comment body
        id: comment-body
        run: |
          cat > comment.md << 'EOF'
          <!-- preview-deployments -->
          ## 🚀 Preview Deployments

          EOF

          # Check if any deployments exist
          HAS_DEPLOYMENTS=false

          if [ "${{ needs.changes.outputs.frontend }}" == "true" ] || [ "${{ needs.changes.outputs.backend }}" == "true" ] || [ "${{ needs.changes.outputs.admin }}" == "true" ]; then
            HAS_DEPLOYMENTS=true

            # Create table header
            echo "| Name | Preview URL | Status | Branch Alias |" >> comment.md
            echo "|------|-------------|--------|--------------|" >> comment.md

            # Frontend row
            if [ "${{ needs.changes.outputs.frontend }}" == "true" ]; then
              if [ "${{ needs.preview_frontend.result }}" == "success" ]; then
                FRONTEND_URL="${{ needs.preview_frontend.outputs.url }}"
                FRONTEND_ALIAS="${{ needs.preview_frontend.outputs.alias }}"
                echo "| 🌐 Frontend | [$FRONTEND_URL]($FRONTEND_URL) | ✅ READY | \`$FRONTEND_ALIAS\` |" >> comment.md
              else
                echo "| 🌐 Frontend | - | ❌ ERROR | - |" >> comment.md
              fi
            fi

            # Backend row
            if [ "${{ needs.changes.outputs.backend }}" == "true" ]; then
              if [ "${{ needs.preview_backend.result }}" == "success" ]; then
                BACKEND_URL="${{ needs.preview_backend.outputs.url }}"
                BACKEND_ALIAS="${{ needs.preview_backend.outputs.alias }}"
                echo "| ⚙️ Backend | [$BACKEND_URL]($BACKEND_URL) | ✅ READY | \`$BACKEND_ALIAS\` |" >> comment.md
              else
                echo "| ⚙️ Backend | - | ❌ ERROR | - |" >> comment.md
              fi
            fi

            # Admin row
            if [ "${{ needs.changes.outputs.admin }}" == "true" ]; then
              if [ "${{ needs.preview_admin.result }}" == "success" ]; then
                ADMIN_URL="${{ needs.preview_admin.outputs.url }}"
                ADMIN_ALIAS="${{ needs.preview_admin.outputs.alias }}"
                echo "| 🔧 Admin | [$ADMIN_URL]($ADMIN_URL) | ✅ READY | \`$ADMIN_ALIAS\` |" >> comment.md
              else
                echo "| 🔧 Admin | - | ❌ ERROR | - |" >> comment.md
              fi
            fi

            echo "" >> comment.md
          fi

          if [ "$HAS_DEPLOYMENTS" == "false" ]; then
            echo "ℹ️ No frontend, backend, or admin changes detected in this PR." >> comment.md
            echo "" >> comment.md
          fi

          echo "---" >> comment.md
          echo "*Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> comment.md

          {
            echo 'COMMENT_BODY<<DELIMITER'
            cat comment.md
            echo 'DELIMITER'
          } >> $GITHUB_OUTPUT

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment-body.outputs.COMMENT_BODY }}
          edit-mode: replace
