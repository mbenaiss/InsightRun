name: Preview Deployments

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the codebase changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  # Deploy frontend preview to Cloudflare Workers
  preview_frontend:
    name: Deploy Frontend Preview
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      url: ${{ steps.extract-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: bun run pages:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_ENV: preview

      - name: Generate preview alias
        id: generate-alias
        run: |
          # Generate valid preview alias from branch name
          # Rules: lowercase, alphanumeric + dashes, must start with letter, max 63 chars with worker name
          BRANCH_NAME="${{ github.head_ref }}"
          # Convert to lowercase, replace non-alphanumeric with dash, remove leading/trailing dashes
          ALIAS=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//' | cut -c1-30)
          # Ensure it starts with a letter
          if ! [[ $ALIAS =~ ^[a-z] ]]; then
            ALIAS="pr-$ALIAS"
          fi
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "Generated alias: $ALIAS"

      - name: Deploy to Cloudflare Workers (Preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.generate-alias.outputs.alias }}
          workingDirectory: frontend
        env:
          NODE_ENV: preview

      - name: Extract deployment URL
        id: extract-url
        run: |
          # Preview URL format: <ALIAS>-<WORKER_NAME>.mbenaissa.workers.dev
          ALIAS="${{ steps.generate-alias.outputs.alias }}"
          PREVIEW_URL="https://${ALIAS}-insightrun-landing.mbenaissa.workers.dev"
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"

  # Deploy backend preview to Cloudflare Workers
  preview_backend:
    name: Deploy Backend Preview
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      url: ${{ steps.extract-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Generate preview alias
        id: generate-alias
        run: |
          # Generate valid preview alias from branch name
          # Rules: lowercase, alphanumeric + dashes, must start with letter, max 63 chars with worker name
          BRANCH_NAME="${{ github.head_ref }}"
          # Convert to lowercase, replace non-alphanumeric with dash, remove leading/trailing dashes
          ALIAS=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//' | cut -c1-30)
          # Ensure it starts with a letter
          if ! [[ $ALIAS =~ ^[a-z] ]]; then
            ALIAS="pr-$ALIAS"
          fi
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "Generated alias: $ALIAS"

      - name: Deploy to Cloudflare Workers (Preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.generate-alias.outputs.alias }}
          workingDirectory: backend
        env:
          NODE_ENV: preview

      - name: Extract deployment URL
        id: extract-url
        run: |
          # Preview URL format: <ALIAS>-<WORKER_NAME>.mbenaissa.workers.dev
          ALIAS="${{ steps.generate-alias.outputs.alias }}"
          PREVIEW_URL="https://${ALIAS}-insightrun-backend.mbenaissa.workers.dev"
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"

  # Comment on PR with preview URLs
  comment:
    name: Comment Preview URLs
    needs: [changes, preview_frontend, preview_backend]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- preview-deployments -->'

      - name: Build comment body
        id: comment-body
        run: |
          cat > comment.md << 'EOF'
          <!-- preview-deployments -->
          ## 🚀 Preview Deployments

          Your changes have been deployed to preview environments:

          EOF

          if [ "${{ needs.changes.outputs.frontend }}" == "true" ] && [ "${{ needs.preview_frontend.result }}" == "success" ]; then
            echo "### 🌐 Frontend Preview" >> comment.md
            echo "" >> comment.md
            echo "✅ **Status:** Deployed successfully" >> comment.md
            echo "" >> comment.md
            if [ -n "${{ needs.preview_frontend.outputs.url }}" ]; then
              echo "🔗 **URL:** ${{ needs.preview_frontend.outputs.url }}" >> comment.md
            else
              echo "🔗 **URL:** Check [Cloudflare Pages](https://dash.cloudflare.com/) for the preview URL" >> comment.md
            fi
            echo "" >> comment.md
          elif [ "${{ needs.changes.outputs.frontend }}" == "true" ]; then
            echo "### 🌐 Frontend Preview" >> comment.md
            echo "" >> comment.md
            echo "❌ **Status:** Deployment failed" >> comment.md
            echo "" >> comment.md
          fi

          if [ "${{ needs.changes.outputs.backend }}" == "true" ] && [ "${{ needs.preview_backend.result }}" == "success" ]; then
            echo "### ⚙️ Backend Preview" >> comment.md
            echo "" >> comment.md
            echo "✅ **Status:** Deployed successfully" >> comment.md
            echo "" >> comment.md
            if [ -n "${{ needs.preview_backend.outputs.url }}" ]; then
              echo "🔗 **URL:** ${{ needs.preview_backend.outputs.url }}" >> comment.md
            else
              echo "🔗 **URL:** Check [Cloudflare Workers](https://dash.cloudflare.com/) for the preview URL" >> comment.md
            fi
            echo "" >> comment.md
          elif [ "${{ needs.changes.outputs.backend }}" == "true" ]; then
            echo "### ⚙️ Backend Preview" >> comment.md
            echo "" >> comment.md
            echo "❌ **Status:** Deployment failed" >> comment.md
            echo "" >> comment.md
          fi

          if [ "${{ needs.changes.outputs.frontend }}" != "true" ] && [ "${{ needs.changes.outputs.backend }}" != "true" ]; then
            echo "ℹ️ No frontend or backend changes detected in this PR." >> comment.md
            echo "" >> comment.md
          fi

          echo "---" >> comment.md
          echo "*Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> comment.md

          {
            echo 'COMMENT_BODY<<DELIMITER'
            cat comment.md
            echo 'DELIMITER'
          } >> $GITHUB_OUTPUT

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment-body.outputs.COMMENT_BODY }}
          edit-mode: replace
